name = "lyubarskii_nes"
version = "0.1.0"
defaultTargets = ["LeanCode", "Showcase", "Showcase_WithProofs"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

# The full proof development.
[[lean_lib]]
name = "LeanCode"

# The statement file a reader audits: definitions and the main theorem, with `sorry`.
# It imports Mathlib only. This is the Comparator challenge module.
[[lean_lib]]
name = "Showcase"
roots = ["Showcase"]

# The same statements with the proofs supplied by `LeanCode`.
# This is the Comparator solution module.
[[lean_lib]]
name = "Showcase_WithProofs"
roots = ["Showcase_WithProofs"]
